<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f1117);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e9297);
            --button-color: var(--tg-theme-button-color, #5865f2);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: #1a1d24;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2 { margin: 0 0 5px 0; font-size: 18px; color: var(--hint-color); }
        .balance { font-size: 38px; font-weight: 800; color: #3ba55d; margin: 10px 0; }
        .username { font-size: 14px; color: var(--hint-color); }
        
        .section-title { font-size: 15px; font-weight: 600; margin: 20px 0 10px 5px; color: var(--hint-color); }
        
        .packages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-package {
            background: var(--card-bg);
            border: 2px solid #2f333d;
            color: var(--text-color);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn-package small { display: block; color: var(--hint-color); font-weight: normal; margin-top: 4px; }
        .btn-package:active { transform: scale(0.96); border-color: var(--button-color); }
        
        .close-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Ваш баланс токенов</h2>
            <div class="balance" id="balanceValue">...</div>
            <div class="username" id="usernameDisplay">загрузка...</div>
        </div>

        <div class="section-title">🪙 Пополнение баланса</div>
        <div class="packages">
            <button class="btn-package" onclick="buy(1, 1)">1 руб.<br><small>1 токен (тест)</small></button>
            <button class="btn-package" onclick="buy(50, 10)">50 руб.<br><small>10 токенов</small></button>
            <button class="btn-package" onclick="buy(100, 20)">100 руб.<br><small>20 токенов</small></button>
            <button class="btn-package" onclick="buy(500, 100)">500 руб.<br><small>100 токенов</small></button>
            <button class="btn-package" onclick="buy(1000, 200)">1000 руб.<br><small>200 токенов</small></button>
            <button class="btn-package" onclick="buy(5000, 1000)">5000 руб.<br><small>1000 токенов</small></button>
        </div>

        <button class="close-btn" onclick="Telegram.WebApp.close()">Закрыть кабинет</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user || { id: 12345, username: 'User' };
        document.getElementById('usernameDisplay').innerText = '@' + (user.username || user.first_name || 'Anonymous');

        async function fetchBalance() {
            try {
                const res = await fetch('/api/get-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, username: user.username })
                });
                const data = await res.json();
                document.getElementById('balanceValue').innerText = data.balance + ' 🪙';
            } catch (e) {
                document.getElementById('balanceValue').innerText = 'Ошибка';
            }
        }

        async function buy(amountRub, coinsCount) {
            try {
                const res = await fetch('/api/create-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, amountRub, coinsCount })
                });
                const data = await res.json();
                if (data.confirmationUrl) {
                    window.open(data.confirmationUrl, '_blank');
                }
            } catch (e) {
                alert('Не удалось создать платеж в ЮKassa');
            }
        }

        fetchBalance();
    </script>
</body>
</html>
